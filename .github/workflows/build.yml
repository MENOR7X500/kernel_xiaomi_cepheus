name: Compilador Kernel Mi9 1.2M Final
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip libyaml-dev
          mkdir -p bin/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -C bin/clang -xzf clang-r522817.tar.gz

      - name: Integrar KernelSU Next (Legacy)
        run: |
          # 1. Remove qualquer pasta anterior para evitar o erro "File exists"
          rm -rf drivers/kernelsu
          
          # 2. Clona em uma pasta temporária e move apenas o conteúdo necessário
          git clone https://github.com/rifsxd/KernelSU-Next temp_ksu
          mv temp_ksu/kernel drivers/kernelsu
          # Caso o repo não tenha a pasta /kernel, use este comando no lugar do de cima:
          # mv temp_ksu drivers/kernelsu
          
          # 3. Garante que o Makefile aponte para a pasta correta
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Compilar
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 cepheus_defconfig
          
          # Resolve o erro de undefined symbol: yaml (Imagem 1)
          scripts/config --file out/.config --disable CONFIG_DTC_FLAGS_YAML
          echo "CONFIG_KSU=y" >> out/.config
          
          # Compilação com flags de compatibilidade
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCFLAGS="-DCONFIG_DTC_FLAGS_YAML=0" \
            DTC_FLAGS="-@ -Wno-graph_child_address"

      - name: Organizar e Upload
        if: always()
        run: |
          find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} . \;

      - name: Criar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Kernel-KSU-Final
          path: Image.gz*
