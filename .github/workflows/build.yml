name: Compilador Kernel Mi9 1.2M Final
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip
          git clone https://gitlab.com/LoS-Vndng/proton-clang -b clang-19 --depth=1 bin/clang

      - name: Compilar Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          make O=out ARCH=arm64 cepheus_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Criar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Kernel-Final
          path: out/arch/arm64/boot/Image.gz-dtb
