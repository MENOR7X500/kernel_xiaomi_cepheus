name: Mi9-Turbo-PocoF5-Target
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip
          mkdir -p bin/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -C bin/clang -xzf clang-r522817.tar.gz

      - name: Faxina Inteligente (Anti-YAML e Anti-KSU)
        run: |
          # 1. Remove a chamada do KernelSU que trava o build por falta de pasta
          sed -i '/kernelsu/d' drivers/Makefile
          
          # 2. Resolve o Erro 293: Mantém o arquivo mas limpa o conteúdo
          echo "/* Esvaziado para evitar erro de YAML */" > scripts/dtc/yamltree.c
          
          # 3. Resolve as linhas 341-367: Remove a instrução de compilação do objeto
          sed -i 's/dtc-objs += yamltree.o//g' scripts/dtc/Makefile
          
          # 4. Desativa dependências externas no compilador de árvore de dispositivos
          echo "HOST_EXTRACFLAGS += -DNO_YAML" >> scripts/dtc/Makefile

      - name: Compilação de Alta Performance
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 cepheus_defconfig
          
          # Desativa as configs problemáticas identificadas nos logs
          scripts/config --file out/.config --disable CONFIG_DTC_FLAGS_YAML
          scripts/config --file out/.config --disable CONFIG_KSU
          
          # Build otimizado para o Mi 9 (Snapdragon 855)
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Organizar e Upload
        if: always()
        run: |
          find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} . \;

      - name: Criar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Turbo-Kernel
          path: Image.gz*
