name: Mi9-Performance-1.2M-Final
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip
          mkdir -p bin/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -C bin/clang -xzf clang-r522817.tar.gz

      - name: Compilar Performance Pura
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          
          # 1. Limpeza total para garantir que não haja restos de YAML (Erro da Imagem 9)
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          
          # 2. Configura o Mi 9 (cepheus)
          make O=out ARCH=arm64 cepheus_defconfig
          
          # 3. MATA DEFINITIVO OS ERROS (YAML e KSU)
          # Removemos o KSU do config para evitar erro de pasta (Imagem 7/8)
          scripts/config --file out/.config --disable CONFIG_KSU
          # Desativa o validador de YAML para evitar o erro de linker (Imagem 9)
          scripts/config --file out/.config --disable CONFIG_DTC_FLAGS_YAML
          
          # 4. Compilação focada em velocidade
          # Usando Clang para otimizar o código final
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Organizar e Upload
        if: always()
        run: |
          # Pega a Image.gz final para você testar
          find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} . \;

      - name: Criar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Kernel-Performance
          path: Image.gz*
