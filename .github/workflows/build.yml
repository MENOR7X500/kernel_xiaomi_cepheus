name: Compilador Kernel Mi9 1.2M Final
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip
          mkdir -p bin/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -C bin/clang -xzf clang-r522817.tar.gz

      - name: Compilar Kernel (Forçado)
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          make O=out ARCH=arm64 cepheus_defconfig
          
          # COMANDO NOVO: Isso aqui vai dizer pro kernel ignorar o erro do KernelSU
          scripts/config --file out/.config --disable CONFIG_KSU
          scripts/config --file out/.config --disable CONFIG_KSU_NEXT
          
          # Tenta compilar o resto do motor (o que dá a performance)
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- || true
          
          # Procura o arquivo final, mesmo que tenha dado avisos
          find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} . \;

      - name: Criar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Kernel-Final
          path: Image.gz*
