name: Compilador Kernel Mi9 1.2M Final
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip libyaml-dev
          mkdir -p bin/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -C bin/clang -xzf clang-r522817.tar.gz

      - name: Integrar KernelSU Next (Legacy)
        run: |
          # Limpa e clona sem criar subpastas extras
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          git clone https://github.com/rifsxd/KernelSU-Next drivers/kernelsu
          
          # Adiciona ao Makefile se necessário
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Compilar
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          
          # LIMPEZA E FIX PARA O ERRO DE YAML (Imagem 9)
          # Removemos o suporte a YAML direto nos arquivos do compilador de DTB
          sed -i 's/dtc-objs += yamltree.o/#dtc-objs += yamltree.o/g' scripts/dtc/Makefile
          rm -f scripts/dtc/yamltree.c
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 cepheus_defconfig
          
          # Configurações de build
          scripts/config --file out/.config --disable CONFIG_DTC_FLAGS_YAML
          echo "CONFIG_KSU=y" >> out/.config
          
          # Compilação focada em evitar o Linker antigo do sistema
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            DTC_FLAGS="-@ -Wno-graph_child_address"

      - name: Organizar e Upload
        if: always()
        run: |
          find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} . \;

      - name: Criar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Kernel-KSU-Final
          path: Image.gz*
