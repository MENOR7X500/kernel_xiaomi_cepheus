name: Compilador Kernel Mi9 1.2M Final
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          # Adicionado libyaml-dev para corrigir o erro de 'undefined symbol: yaml'
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip libyaml-dev
          mkdir -p bin/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -C bin/clang -xzf clang-r522817.tar.gz

      - name: Integrar KernelSU Next (Legacy)
        run: |
          # Baixa o código do KSU Next
          rm -rf drivers/kernelsu
          git clone https://github.com/rifsxd/KernelSU-Next drivers/kernelsu
          
          # Garante a inclusão no Makefile
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Compilar
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          
          # Limpeza total
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          
          # Configura o Mi 9
          make O=out ARCH=arm64 cepheus_defconfig
          
          # Ativa o KernelSU e garante suporte a YAML no script de build
          scripts/config --file out/.config --enable CONFIG_KSU
          echo "CONFIG_KSU=y" >> out/.config
          
          # Compilação principal
          # Removi o LLVM=1 temporariamente para testar a compatibilidade do linker padrão com libyaml
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Organizar Arquivos
        run: |
          # Procura qualquer variação de Image (gz, dtb, etc)
          find out/arch/arm64/boot/ -name "Image*" -exec cp {} . \;

      - name: Criar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Kernel-Final
          path: |
            Image*
