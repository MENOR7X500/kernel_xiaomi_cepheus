name: Compilador Kernel Mi9 1.2M Final
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip libyaml-dev
          mkdir -p bin/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -C bin/clang -xzf clang-r522817.tar.gz

      - name: Integrar KernelSU Next (Legacy)
        run: |
          # 1. Baixa o KSU diretamente na pasta drivers/kernelsu
          mkdir -p drivers/kernelsu
          git clone https://github.com/rifsxd/KernelSU-Next drivers/kernelsu
          
          # 2. Garante que o Makefile dos drivers saiba que a pasta existe
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi

      - name: Compilar
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          
          # Limpeza total para evitar lixo de tentativas anteriores
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          
          # Configura o Mi 9
          make O=out ARCH=arm64 cepheus_defconfig
          
          # SOLUÇÃO PARA O ERRO DA IMAGEM 1: Desativa o YAML que quebra o build
          # Isso resolve o "undefined symbol: yaml_scalar_event_initialize"
          sed -i 's/CONFIG_DTC_FLAGS_YAML=y/CONFIG_DTC_FLAGS_YAML=n/g' out/.config
          
          # Ativa o KernelSU no config
          echo "CONFIG_KSU=y" >> out/.config
          
          # Compilação - Usando CROSS_COMPILE e desativando avisos fatais
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            DTC_FLAGS="-@ -Wno-graph_child_address"

      - name: Organizar e Upload
        run: |
          # Procura a imagem gerada (pode ser Image.gz ou Image.gz-dtb)
          find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} . \;

      - name: Criar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Kernel-KSU-Final
          path: Image.gz*
