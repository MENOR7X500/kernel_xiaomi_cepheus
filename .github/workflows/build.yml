name: Mi9-Turbo-PocoF5-Target
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip libyaml-dev
          mkdir -p bin/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -C bin/clang -xzf clang-r522817.tar.gz

      - name: Remoção Forçada de Conflitos
        run: |
          # Remove a chamada do KernelSU que trava o build por falta de arquivos
          sed -i '/kernelsu/d' drivers/Makefile
          
          # Desativa o suporte a YAML no utilitário DTC para evitar erros de símbolo
          sed -i 's/dtc-objs += yamltree.o/#dtc-objs += yamltree.o/g' scripts/dtc/Makefile

      - name: Compilação de Alta Performance
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 cepheus_defconfig
          
          # Garante que as flags problemáticas estejam desativadas
          scripts/config --file out/.config --disable CONFIG_DTC_FLAGS_YAML
          scripts/config --file out/.config --disable CONFIG_KSU
          
          # Build com Clang r522817 para máxima otimização
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Artifact
        if: always()
        run: |
          find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} . \;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Turbo-Kernel
          path: Image.gz*
