name: Build Kernel Cepheus
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm clang libssl-dev libelf-dev

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out cepheus_defconfig
          make -j$(nproc --all) O=out \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Cepheus-Teste
          path: out/arch/arm64/boot/Image.gz-dtb
          
