name: Compilador Kernel Mi9 1.2M Final
on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: '13.0'
          fetch-depth: 0

      - name: Instalar Ferramentas
        run: |
          sudo apt update
          sudo apt install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev flex bison zip libyaml-dev
          mkdir -p bin/clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -C bin/clang -xzf clang-r522817.tar.gz

      - name: Integrar KernelSU Next (Forçado)
        run: |
          # Garante que estamos na raiz do kernel e baixa o KSU
          # O comando 'pwd' ajuda a debugar se necessário
          KSU_DIR="drivers/kernelsu"
          rm -rf "$KSU_DIR"
          git clone https://github.com/rifsxd/KernelSU-Next "$KSU_DIR"
          
          # Verifica se o Makefile de drivers já tem o KSU, se não, adiciona no final
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          echo "Conteúdo da pasta drivers/kernelsu:"
          ls "$KSU_DIR"

      - name: Compilar
        run: |
          export PATH="$GITHUB_WORKSPACE/bin/clang/bin:$PATH"
          
          # Limpeza total
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          
          # Configura o Mi 9 (cepheus)
          make O=out ARCH=arm64 cepheus_defconfig
          
          # FORÇAR CONFIGS E DESATIVAR YAML (Erro da Imagem 1)
          # Isso desativa o validador de YAML que está quebrando o Linker
          scripts/config --file out/.config --enable CONFIG_KSU
          scripts/config --file out/.config --disable CONFIG_DTC_FLAGS_YAML
          echo "CONFIG_KSU=y" >> out/.config
          
          # Compilação principal
          # Usando flags para ignorar erros de YAML no DTC
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            DTC_FLAGS="-@ -Wno-graph_child_address"

      - name: Organizar Arquivos
        run: |
          # Pega a imagem gerada
          find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} . \;

      - name: Criar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Kernel-Final
          path: Image.gz*
